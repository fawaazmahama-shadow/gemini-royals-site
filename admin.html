<!DOCTYPE html>
<html lang="en" data-theme="dark" data-mood="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Gemini Royals ♊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--r:18px;--bg:#080a16;--card:#121630;--tx:#eef0ff;--mut:#8f97bd;--ac:#7c5cff;--ac2:#22d3ee;--ln:#ffffff18}
[data-theme=light]{--bg:#f5f6fb;--card:#fff;--tx:#12142a;--mut:#5d6385;--ln:#00000014}
[data-mood=pro]{--ac:#2563eb;--ac2:#0ea5e9}
[data-mood=vibrant]{--ac:#ff3d81;--ac2:#ffb020}
[data-mood=elegant]{--ac:#b8913f;--ac2:#e8d9b0}
*{box-sizing:border-box;margin:0}
body{font:16px/1.6 'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;
background-image:radial-gradient(60% 40% at 10% -10%,color-mix(in srgb,var(--ac) 30%,transparent),transparent),radial-gradient(50% 40% at 100% 0,color-mix(in srgb,var(--ac2) 20%,transparent),transparent);background-attachment:fixed}
h1,h2,h3{font-family:Fraunces,serif;line-height:1.1}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:12px 20px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);flex-wrap:wrap}
.logo{font:800 1.3rem Fraunces,serif;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;color:transparent;text-decoration:none}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}
nav a{color:var(--mut);text-decoration:none;padding:6px 12px;border-radius:99px;white-space:nowrap;font-size:.92rem}
nav a.on,nav a:hover{color:var(--tx);background:var(--ln)}
select,input,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:9px 12px;width:100%}
header select{width:auto}
.btn,.ic{cursor:pointer;border:0;border-radius:99px;padding:10px 20px;font:700 .95rem inherit;font-family:inherit;color:#fff;background:linear-gradient(90deg,var(--ac),var(--ac2));text-decoration:none;display:inline-block}
.ic{padding:8px 12px;background:var(--card);color:var(--tx);border:1px solid var(--ln)}
main{max-width:1000px;margin:0 auto;padding:32px 20px 60px}
.hero{padding:48px 0 24px}.hero h1{font-size:clamp(2.4rem,7vw,4.6rem);font-weight:800;margin-bottom:14px}
.hero p{color:var(--mut);max-width:560px;margin-bottom:22px}
.cd{display:flex;gap:12px;margin:18px 0 26px;flex-wrap:wrap}
.cd div{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:14px 20px;text-align:center;min-width:84px}
.cd b{display:block;font:800 2rem Fraunces,serif;color:var(--ac2)}.cd span{font-size:.75rem;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:20px;position:relative}
a.card{color:inherit;text-decoration:none;transition:.2s}a.card:hover{transform:translateY(-4px);border-color:var(--ac)}
.card h3{margin-bottom:6px}.card p,.mut{color:var(--mut);font-size:.93rem}
.form{display:grid;gap:10px;margin-bottom:22px}
.c{text-align:center;max-width:420px;margin:40px auto}
.tl{border-left:2px solid var(--ln);margin-left:8px;padding-left:22px;display:grid;gap:16px}
.tl .card::before{content:'';position:absolute;left:-30px;top:24px;width:14px;height:14px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 4px var(--bg)}
.tl .past{opacity:.6}
.ph{padding:0;overflow:hidden}.ph img{width:100%;height:210px;object-fit:cover;display:block}.ph div{padding:12px 16px}
.x{position:absolute;right:12px;top:10px;background:none;border:0;color:var(--mut);cursor:pointer}
iframe{width:100%;height:70vh;border:0;border-radius:var(--r);margin-bottom:18px;background:#000}
h2{font-size:2rem;margin-bottom:18px}
footer{border-top:1px solid var(--ln);padding:28px 20px;text-align:center;color:var(--mut)}
footer .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
main{animation:in .5s ease both}@keyframes in{from{opacity:0;transform:translateY(12px)}}

.btn.sm{padding:6px 14px;font-size:.8rem;margin:8px 6px 0 0}details{margin-top:10px;font-size:.85rem}
.pwb{position:relative}.pwb input{padding-right:48px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;font-size:1.1rem;padding:6px}
.av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:800 1.4rem Fraunces,serif;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));margin-bottom:12px}
@media(max-width:720px){nav{flex:1 1 100%;order:3}header{gap:8px;padding:10px 14px}main{padding:22px 16px 48px}.hero{padding-top:24px}.cd div{min-width:70px;padding:10px 12px}}

/* vertical sidebar menu */
html{scrollbar-width:thin;scrollbar-color:var(--ac) transparent}
[data-theme=dark]{color-scheme:dark}[data-theme=light]{color-scheme:light}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--ac),var(--ac2));border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{filter:brightness(1.2)}::-webkit-scrollbar-corner{background:var(--bg)}
body{padding-left:250px}
header{position:fixed;left:0;top:0;bottom:0;width:250px;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:10px;padding:20px 14px;border-bottom:0;border-right:1px solid var(--ln);overflow-y:auto;z-index:20;background:color-mix(in srgb,var(--card) 94%,transparent)}
header .logo{font-size:1.4rem;padding:4px 10px 12px}
nav{flex-direction:column;overflow:visible;gap:2px}
nav a{padding:10px 14px;border-radius:12px;font-size:.95rem}
nav a.on{background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 28%,transparent),transparent);box-shadow:inset 3px 0 0 var(--ac)}
header select,header .ic{width:100%}
.bar{display:none}
@media(max-width:900px){
body{padding-left:0;padding-top:56px}
.bar{display:flex;position:fixed;top:0;left:0;right:0;height:56px;align-items:center;gap:12px;padding:0 14px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln);z-index:15}
header{transform:translateX(-105%);transition:transform .25s;width:min(280px,82vw);background:var(--card)}
header.open{transform:none;box-shadow:0 0 60px #000a}
main{padding:22px 16px 48px}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body data-page="admin">
<div class="bar"><button class="ic" id="mb" aria-label="Open menu">☰</button><a class="logo" href="index.html">Gemini Royals ♊</a></div>
<header>
<a class="logo" href="index.html">Gemini Royals ♊</a>
<nav id="nav"></nav>
<select id="mood" aria-label="Design mood"><option value="midnight">Midnight</option><option value="pro">Professional</option><option value="vibrant">Vibrant</option><option value="elegant">Elegant</option></select>
<button class="ic" id="th" aria-label="Toggle light or dark mode">☀️</button>
<button class="ic" id="auth"></button>
</header>
<main id="app"></main>
<footer>
<div class="row">
<a class="ic" href="https://www.google.com/maps/search/?api=1&query=Accra,Ghana" target="_blank" rel="noopener">📍 Location</a>
<a class="ic" href="https://wa.me/233553550042" target="_blank" rel="noopener">💬 WhatsApp</a>
<a class="ic" href="tel:+233553550042">📞 Call</a>
<a class="ic" href="https://linkedin.com/in/fawaaz-mahama-a799533a5" target="_blank" rel="noopener">💼 LinkedIn</a>
<a class="ic" href="https://www.tiktok.com/@hollow.gh" target="_blank" rel="noopener">🎵 TikTok</a>
</div>
Made with care for the people who study together.
</footer>
<script>
// ---- CONFIG: paste your Supabase project values. Leave blank for demo mode (data saved in this browser only).
const CFG={url:'https://awlfqtgsypupcsmtwbgz.supabase.co',key:'sb_publishable_2jooo62yc0thHWQH2RRKwQ_AyItmdyM'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d).toLocaleString([],{dateStyle:'medium',timeStyle:'short'});
const sb=(CFG.url&&CFG.key&&window.supabase)?supabase.createClient(CFG.url,CFG.key):null;
const LS=t=>{try{return JSON.parse(localStorage.getItem('sg_'+t)||'[]')}catch(e){return[]}};
let user=null;

const db={
 async list(t){if(sb){const{data}=await sb.from(t).select('*').order('created_at',{ascending:false});return data||[]}return LS(t)},
 async add(t,r,q){r.created_at=new Date().toISOString();
  if(sb){const{error}=await sb.from(t).insert(r);if(error&&!q)alert(error.message)}
  else{r.id=Date.now();localStorage.setItem('sg_'+t,JSON.stringify([r,...LS(t)]))}},
 async del(t,id){if(sb)await sb.from(t).delete().eq('id',id);else localStorage.setItem('sg_'+t,JSON.stringify(LS(t).filter(x=>x.id!=id)))}
};
async function up(f){
 if(sb){const p=Date.now()+'-'+f.name.replace(/[^\w.]/g,'_');const{error}=await sb.storage.from('files').upload(p,f);
  if(error){alert(error.message);return''}return sb.storage.from('files').getPublicUrl(p).data.publicUrl}
 if(f.size>2e6){alert('Demo mode only keeps small files. Connect Supabase for real uploads.');return''}
 return new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
}
window.add=async e=>{e.preventDefault();const f=e.target,t=f.dataset.t,r={};
 for(const[k,v]of new FormData(f)){if(v instanceof File){if(v.size)r.url=await up(v)}else if(v!=='')r[k]=v}
 if(r.starts_at)r.starts_at=new Date(r.starts_at).toISOString();
 if(r.event_date)r.event_date=new Date(r.event_date).toISOString();
 if(!r.url&&r.link)r.url=r.link;delete r.link;
 if(t==='photos'&&!r.url)return alert('Please choose a photo.');if(t==='recordings'&&!r.url)return alert('Add a video file or paste a link.');
 if(r.guests)r.guests=true;if(t==='classes'&&!sb)r.room=Math.random().toString(36).slice(2,12)+Date.now().toString(36);
 await db.add(t,r);f.reset();route();return false};
window.rm=async(t,id)=>{await db.del(t,id);route()};
window.join=async(u,i)=>{const jit=u.startsWith('https://meet.jit.si/');window.open(jit?u+'#userInfo.displayName=%22'+encodeURIComponent(user.name||'Guest')+'%22':u,'_blank','noopener');await db.add('attendance',{class_id:+i,email:user.email,name:user.name},1)};
window.setRole=async(id,r)=>{const{error}=await sb.from('profiles').update({role:r}).eq('id',id);if(error)alert(error.message);await load(user);route()};

const form=(t,inner)=>`<form class="card form" data-t="${t}" onsubmit="return add(event)">${inner}<button class="btn">Add</button></form>`;
const del=(t,x)=>user&&(!sb||x.created_by===user.id||user.role==='admin')?`<button class="x" title="Delete" onclick="rm('${t}',${x.id})">✕</button>`:'';
const ok=g=>user&&(g?['member','admin','guest']:['member','admin']).includes(user.role);
const gate=()=>`<div class="card c"><h2>${!user?'Members only':user.role==='pending'?'Awaiting approval':'Full members only'}</h2><p class="mut" style="margin-bottom:16px">${!user?'Sign in to see this page.':user.role==='pending'?'Thanks for signing up! An admin will verify you as a full member or a one-time guest. Check back soon.':'One-time guest access only covers classes opened to guests.'}</p>${user?'':'<a class="btn" href="login.html">Sign in</a>'}</div>`;
const empty=m=>`<p class="mut">${m}</p>`;

const pages={
 async home(){
  const ev=(await db.list('events')).filter(e=>new Date(e.event_date)>new Date()).sort((a,b)=>new Date(a.event_date)-new Date(b.event_date))[0];
  const an=ok()?(await db.list('announcements'))[0]:null;const tiles=[['timeline','🗓️','Timeline','Milestones, exams and events.'],['classes','🎥','Online classes','Live sessions, right here.'],['recordings','🎞️','Recordings','Watch or download past classes.'],['resources','📚','Resources','Share notes, slides and links.'],['gallery','📸','Memories','Photos from our journey.'],['wishes','💌','Guestbook','Leave a message for the group.'],['community','📲','WhatsApp','Our WhatsApp group, for members.'],['chat','💬','Group chat','Chat with the group, right here.'],['announcements','📢','Announcements','News from the admins.'],['assignments','📝','Assignments','Deadlines and what’s due.'],['members','🧑‍🤝‍🧑','Members','Meet the rest of the group.'],['about','👥','Creators','Who built this site.']];
  return`<section class="hero"><h1>Learn together.<br>Grow together.</h1><p>Welcome to Gemini Royals ♊, our private space for classes, resources, memories and everything in between.</p>
  ${ev?`<p class="mut">Next up: <b style="color:var(--tx)">${esc(ev.title)}</b></p><div class="cd" id="cd" data-t="${ev.event_date}"></div>`:''}
  ${an?`<div class="card" style="margin:18px 0;max-width:560px"><span class="mut">📢 Latest announcement</span><h3>${esc(an.title)}</h3><p>${esc(an.body).slice(0,140)}</p></div>`:''}<a class="btn" href="${user?'classes':'login'}.html">${user?'Join a class':'Sign in to enter'}</a></section>
  <div class="grid">${tiles.map(t=>`<a class="card" href="${t[0]}.html"><div style="font-size:1.8rem">${t[1]}</div><h3>${t[2]}</h3><p>${t[3]}</p></a>`).join('')}</div>`},
 async timeline(){if(!ok())return gate();const l=(await db.list('events')).sort((a,b)=>new Date(a.event_date)-new Date(b.event_date));
  return`<h2>Timeline</h2>${form('events','<input name="title" placeholder="What’s happening?" required><input name="event_date" type="datetime-local" required><textarea name="note" rows="2" placeholder="Details (optional)"></textarea>')}
  <div class="tl">${l.map(e=>`<div class="card ${new Date(e.event_date)<new Date()?'past':''}">${del('events',e)}<span class="mut">${fmt(e.event_date)}</span><h3>${esc(e.title)}</h3><p>${esc(e.note)}</p></div>`).join('')||empty('No events yet. Add the first one.')}</div>`},
 async gallery(){if(!ok())return gate();const l=await db.list('photos');
  return`<h2>Memories</h2>${form('photos','<input name="file" type="file" accept="image/*"><input name="caption" placeholder="Caption">')}
  <div class="grid">${l.map(p=>`<div class="card ph">${del('photos',p)}<img src="${esc(p.url)}" alt="${esc(p.caption)}" loading="lazy"><div>${esc(p.caption)}</div></div>`).join('')||empty('No photos yet.')}</div>`},
 async wishes(){const l=await db.list('wishes');
  return`<h2>Guestbook</h2>${form('wishes','<input name="name" placeholder="Your name" required><textarea name="message" rows="3" placeholder="Write something kind…" required></textarea>')}
  <div class="grid">${l.map(w=>`<div class="card">${del('wishes',w)}<p style="color:var(--tx)">“${esc(w.message)}”</p><p class="mut" style="margin-top:8px">— ${esc(w.name)}</p></div>`).join('')||empty('Be the first to leave a message.')}</div>`},
 async classes(){if(!ok(1))return gate();const g=user.role==='guest';
  const l=(await db.list('classes')).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
  const at=user.role==='admin'?await db.list('attendance'):[];const now=Date.now();
  return`<h2>Online classes</h2><p class="mut" style="margin-bottom:16px">Join opens the meeting in a new tab. Add a Google Meet or Zoom link when scheduling if you prefer.</p>${g?'<p class="mut" style="margin-bottom:16px">One-time guest access: you only see classes opened to guests.</p>':form('classes','<input name="title" placeholder="Class topic" required><input name="starts_at" type="datetime-local" required><input name="meet" type="url" placeholder="Meeting link (optional: Google Meet, Zoom…)"><label class="mut"><input type="checkbox" name="guests" style="width:auto"> Open to one-time guests</label>')}
  <div class="grid">${l.map(c=>{const s=new Date(c.starts_at),d=s-now,soon=d<18e5&&d>-72e5,n=[...new Set(at.filter(a=>a.class_id==c.id).map(a=>a.name||a.email))];
  const z=x=>new Date(x).toISOString().replace(/[-:]|\.\d+/g,'');const btn='style="background:var(--ln);color:var(--tx)" target="_blank" rel="noopener"';
  return`<div class="card">${del('classes',c)}<span class="mut">${fmt(c.starts_at)}${soon?' · <b style="color:var(--ac2)">Live window</b>':d>0&&d<864e5?' · <b style="color:var(--ac2)">Within 24h</b>':''}${c.guests?' · guests welcome':''}</span><h3>${esc(c.title)}</h3>
  <button class="btn sm" data-u="${esc(/^https:\/\//.test(c.meet||'')?c.meet:'https://meet.jit.si/'+encodeURIComponent(c.room||'sg-'+c.id))}" data-i="${c.id}" onclick="join(this.dataset.u,this.dataset.i)">Join live</button>
  <a class="btn sm" ${btn} href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(c.title+' - Gemini Royals')}&dates=${z(s)}/${z(+s+36e5)}">⏰ Remind me</a>
  ${g?'':`<a class="btn sm" ${btn} href="https://wa.me/?text=${encodeURIComponent('Class: '+c.title+' on '+fmt(c.starts_at)+'. Join us on the Gemini Royals site!')}">💬 Share</a>`}
  ${user.role==='admin'?`<details class="mut"><summary>Attendance (${n.length})</summary>${n.map(esc).join(', ')||'No one yet'}</details>`:''}</div>`}).join('')||empty('No classes scheduled.')}</div>`},
 async resources(){if(!ok())return gate();const l=await db.list('resources');
  return`<h2>Resources</h2>${form('resources','<input name="title" placeholder="Title" required><input name="subject" placeholder="Course / subject"><input name="file" type="file"><input name="link" type="url" placeholder="…or paste a link">')}
  <div class="grid">${l.map(r=>`<div class="card">${del('resources',r)}<span class="mut">${esc(r.subject)}</span><h3>${esc(r.title)}</h3>${r.url?`<a class="btn" style="margin-top:10px" href="${esc(r.url)}" target="_blank" rel="noopener" ${r.url.startsWith('data:')?`download="${esc(r.title)}"`:''}>Open</a>`:''}</div>`).join('')||empty('Nothing shared yet.')}</div>`},
async community(){if(!ok())return gate();
  const r=(await db.list('settings')).find(s=>s.key==='whatsapp'),u=r&&r.value||'';
  return`<h2>WhatsApp group</h2><div class="card c" style="margin-top:0"><div style="font-size:2.4rem">💬</div><h3>Gemini Royals ♊ WhatsApp group</h3><p class="mut" style="margin:8px 0 18px">For members only. Please don’t share this link outside the group.</p>${u.startsWith('https://chat.whatsapp.com/')?`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">Join on WhatsApp</a>`:'<p class="mut">The group link loads from the database once Supabase is connected.</p>'}</div>`},
 async announcements(){if(!ok())return gate();const l=await db.list('announcements');
  return`<h2>Announcements</h2>${user.role==='admin'?form('announcements','<input name="title" placeholder="Headline" required><textarea name="body" rows="3" placeholder="Message to the whole group" required></textarea>'):''}<div class="grid" style="grid-template-columns:1fr">${l.map(a=>`<div class="card">${del('announcements',a)}<span class="mut">${fmt(a.created_at)}</span><h3>${esc(a.title)}</h3><p style="color:var(--tx);white-space:pre-wrap">${esc(a.body)}</p></div>`).join('')||empty('No announcements yet.')}</div>`},
 async assignments(){if(!ok())return gate();const l=(await db.list('assignments')).sort((a,b)=>new Date(a.due_at)-new Date(b.due_at));let dn=[];try{dn=JSON.parse(localStorage.getItem('sg_done')||'[]')}catch(e){}
  return`<h2>Assignments</h2>${form('assignments','<input name="title" placeholder="Assignment" required><input name="course" placeholder="Course"><input name="due_at" type="datetime-local" required><textarea name="note" rows="2" placeholder="Notes (optional)"></textarea>')}<div class="grid">${l.map(a=>{const d=new Date(a.due_at)-Date.now(),x=dn.includes(a.id);return`<div class="card ${x?'past':''}">${del('assignments',a)}<span class="mut">${esc(a.course)} · due ${fmt(a.due_at)}${!x&&d<0?' · <b style="color:#ff5c7a">Overdue</b>':!x&&d<2592e5?' · <b style="color:var(--ac2)">Due soon</b>':''}</span><h3>${esc(a.title)}</h3><p>${esc(a.note)}</p><label class="mut"><input type="checkbox" style="width:auto" ${x?'checked':''} onchange="mark(${a.id})"> Done</label></div>`}).join('')||empty('No assignments yet.')}</div>`},
 async chat(){if(!ok())return gate();
  return`<h2>Group chat</h2><div class="card" style="padding:0"><div id="msgs" style="height:55vh;overflow-y:auto;padding:16px;display:grid;gap:10px;align-content:start"></div><form id="cf" style="display:flex;gap:8px;padding:12px;border-top:1px solid var(--ln)"><input id="ct" placeholder="Message the group…" autocomplete="off" required><button class="btn">Send</button></form></div>`},
 async members(){if(!ok())return gate();
  const l=(await db.list('profiles')).filter(p=>p.role==='member'||p.role==='admin').sort((a,b)=>(b.role==='admin')-(a.role==='admin')||(a.full_name||'').localeCompare(b.full_name||''));
  const me=l.find(p=>p.id===user.id)||{full_name:user.name,bio:'',program:''};
  return`<h2>Members</h2><form class="card form" onsubmit="return saveMe(event)"><h3>My profile</h3><input name="full_name" value="${esc(me.full_name)}" placeholder="Your name" required><input name="program" value="${esc(me.program)}" placeholder="Programme / level, e.g. BSc Computer Science, Level 200"><textarea name="bio" rows="2" placeholder="A line about you">${esc(me.bio)}</textarea><button class="btn">Save profile</button></form><div class="grid">${l.map(p=>`<div class="card"><div class="av">${esc(ini(p.full_name))}</div><h3>${esc(p.full_name||'Member')}</h3><p style="color:var(--ac2);font-size:.85rem">${p.role==='admin'?'Admin':'Member'}${p.program?' · '+esc(p.program):''}</p><p class="mut">${esc(p.bio)}</p></div>`).join('')||empty('No members yet.')}</div>`},
 async about(){const c=x=>`<a class="btn sm" style="background:var(--ln);color:var(--tx)" target="_blank" rel="noopener" href="${esc(x[0])}">${x[1]}</a>`;
  return`<h2>The creator</h2><p class="mut" style="margin-bottom:20px">Gemini Royals ♊ was designed and built by:</p><div class="grid">${CREATORS.map(p=>`<div class="card"><div class="av">${esc(p.name.split(' ').slice(0,2).map(w=>w[0]).join(''))}</div><h3>${esc(p.name)}</h3><p style="color:var(--ac2);font-size:.9rem">${esc(p.role)}</p><p class="mut" style="margin:8px 0">${esc(p.bio)}</p><p class="mut">✉️ ${esc(p.email)}<br>📞 ${esc(p.phone)}${p.phone2?' / '+esc(p.phone2):''}</p>${[['https://wa.me/'+p.wa,'💬 WhatsApp'],['tel:+233'+p.phone.slice(1),'📞 Call'],['mailto:'+p.email,'✉️ Email'],[p.linkedin,'💼 LinkedIn'],[p.tiktok,'🎵 TikTok']].filter(x=>x[0]).map(c).join('')}</div>`).join('')}</div>`},
 async recordings(){if(!ok())return gate();
  const cl=await db.list('classes'),l=await db.list('recordings');const nm=id=>{const c=cl.find(x=>x.id==id);return c?c.title+' · '+fmt(c.starts_at):''};
  return`<h2>Recordings</h2>${user.role==='admin'?form('recordings',`<input name="title" placeholder="Recording title" required><select name="class_id"><option value="">Which class? (optional)</option>${cl.map(c=>`<option value="${c.id}">${esc(c.title)} · ${fmt(c.starts_at)}</option>`).join('')}</select><input name="file" type="file" accept="video/*"><input name="link" type="url" placeholder="…or paste a link (Google Drive, YouTube unlisted)"><p class="mut">Tip: a full class is often bigger than the free upload limit (about 50 MB), so a link is safer for long videos.</p>`):''}<div class="grid">${l.map(r=>{const u=r.url||'',v=/^data:video/.test(u)||/\.(mp4|webm|mov|m4v|ogg)(\?|$)/i.test(u),safe=/^(https:\/\/|data:video)/.test(u),dl=u.startsWith('data:')?u:u+(u.includes('?')?'&':'?')+'download='+encodeURIComponent(r.title);
  return`<div class="card">${del('recordings',r)}<span class="mut">${esc(nm(r.class_id))||fmt(r.created_at)}</span><h3>${esc(r.title)}</h3>${safe&&v?`<video controls preload="metadata" playsinline style="width:100%;border-radius:12px;margin:10px 0" src="${esc(u)}"></video><a class="btn sm" href="${esc(dl)}" download>⬇️ Download</a>`:safe?`<a class="btn sm" href="${esc(u)}" target="_blank" rel="noopener">▶ Watch</a>`:''}</div>`}).join('')||empty('No recordings yet.')}</div>`},
 async admin(){if(!user||user.role!=='admin')return gate();if(!sb)return'<h2>Admin</h2><p class="mut">Connect Supabase to manage members.</p>';
  const o={pending:0,guest:1,member:2,admin:3};const l=(await db.list('profiles')).sort((a,b)=>o[a.role]-o[b.role]);const pend=l.filter(p=>p.role==='pending').length;
  const b=(id,r,t)=>`<button class="btn sm" onclick="setRole('${id}','${r}')">${t}</button>`;
  return`<h2>Members</h2><p class="mut" style="margin-bottom:16px">${pend?`<b style="color:var(--ac2)">${pend} waiting for your approval.</b>`:'No one is waiting.'} Nobody gets in until you approve them as a full member or a one-time guest.</p><div class="grid">${l.map(p=>`<div class="card" ${p.role==='pending'?'style="border-color:var(--ac2)"':''}><h3>${esc(p.full_name||p.email)}</h3><p class="mut">${esc(p.email)}<br>Asked for: ${esc(p.requested)} · Now: <b style="color:var(--ac2)">${p.role}</b></p>${p.role==='admin'?'<p class="mut" style="margin-top:8px">Admin account</p>':b(p.id,'member','✅ Full member')+b(p.id,'guest','🎟️ One-time')+b(p.id,'pending','⛔ Revoke')}</div>`).join('')}</div>`},
 async login(){return`<form class="card c form" id="lf"><h2>Welcome</h2><input id="em" type="email" placeholder="Email" required><div class="pwb"><input id="pw" type="password" placeholder="Password (6+ chars)" minlength="6" required><button type="button" class="eye" aria-label="Show or hide password" onclick="const p=$('#pw');p.type=p.type==='password'?'text':'password';this.textContent=p.type==='password'?'👁️':'🙈'">👁️</button></div>
  <input id="nm" placeholder="Full name (new accounts)"><select id="rq"><option value="member">I want to be a full member</option><option value="guest">One-time visit (guest)</option></select><button class="btn" data-m="in">Sign in</button><button class="btn" data-m="up" style="background:var(--ln);color:var(--tx)">Create account</button>${sb?'':'<p class="mut">Demo mode: any email works.</p>'}</form>`}
};

const ini=n=>(n||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
window.saveMe=async e=>{e.preventDefault();const r=Object.fromEntries(new FormData(e.target));
 if(sb){const{error}=await sb.from('profiles').update(r).eq('id',user.id);if(error)return alert(error.message)}
 else{const l=LS('profiles').filter(p=>p.id!==user.id);localStorage.setItem('sg_profiles',JSON.stringify([{id:user.id,email:user.email,role:user.role,created_at:new Date().toISOString(),...r},...l]))}
 user.name=r.full_name;route();return false};
let pendN=0;
async function load(u){user=u;if(u&&sb){const{data}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();user.role=data?.role||'pending';user.name=data?.full_name||u.email;pendN=0;if(user.role==='admin'){const{count}=await sb.from('profiles').select('id',{count:'exact',head:true}).eq('role','pending');pendN=count||0}}}
// Add more creators here: copy the block, change the details.
const CREATORS=[{name:'Mahama Fawaaz Alelemato',role:'Founder & lead developer · Tech Labs',bio:'Computer Science student in Accra who designs and builds websites and runs Tech Labs: web design, software training, and software installation and activation.',email:'fawaazmahama@gmail.com',phone:'0553550042',phone2:'0500121785',wa:'233553550042',linkedin:'https://linkedin.com/in/fawaaz-mahama-a799533a5',tiktok:'https://www.tiktok.com/@hollow.gh'}];
let chatT;
async function loadMsgs(){const b=$('#msgs');if(!b)return clearInterval(chatT);const l=(await db.list('messages')).reverse().slice(-100);const bot=b.scrollTop+b.clientHeight>=b.scrollHeight-40;
 b.innerHTML=l.map(m=>{const me=user&&m.author_name===(user.name||user.email);return`<div style="justify-self:${me?'end':'start'};max-width:80%;background:${me?'var(--ac)':'var(--bg)'};color:${me?'#fff':'var(--tx)'};padding:8px 12px;border-radius:14px"><small style="opacity:.7">${esc(m.author_name)} · ${new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</small><div style="white-space:pre-wrap">${esc(m.body)}</div></div>`}).join('')||'<p class="mut">Say hello 👋</p>';if(bot)b.scrollTop=b.scrollHeight}
function initChat(){loadMsgs().then(()=>{const b=$('#msgs');if(b)b.scrollTop=b.scrollHeight});clearInterval(chatT);chatT=setInterval(loadMsgs,4000);
 $('#cf').onsubmit=async e=>{e.preventDefault();const i=$('#ct');await db.add('messages',{body:i.value,author_name:user.name||user.email});i.value='';await loadMsgs();$('#msgs').scrollTop=1e9}}
window.mark=id=>{let d=[];try{d=JSON.parse(localStorage.getItem('sg_done')||'[]')}catch(e){}localStorage.setItem('sg_done',JSON.stringify(d.includes(id)?d.filter(x=>x!==id):[...d,id]));route()};
const links=[['timeline','Timeline'],['classes','Classes'],['recordings','Recordings'],['resources','Resources'],['gallery','Memories'],['wishes','Guestbook'],['announcements','Announcements'],['assignments','Assignments'],['chat','Chat'],['community','WhatsApp'],['members','Members'],['about','Creators']];
async function route(){
 const p=document.body.dataset.page||'home';const k=pages[p]?p:'home';
 $('#nav').innerHTML=links.concat(user&&user.role==='admin'?[['admin','Admin'+(pendN?' ('+pendN+')':'')]]:[]).map(l=>`<a href="${l[0]}.html" class="${l[0]===k?'on':''}">${l[1]}</a>`).join('');
 $('#auth').textContent=user?`Sign out (${user.role||'demo'})`:'Sign in';
 $('#app').innerHTML=await pages[k]();if(k==='chat'&&$('#cf'))initChat();
 const f=$('#lf');if(f)f.onsubmit=e=>e.preventDefault(),f.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>login(b.dataset.m));
 tick();
}
async function login(m){const email=$('#em').value,password=$('#pw').value;if(!email||password.length<6)return;
 if(sb){const{error}=await(m==='up'?sb.auth.signUp({email,password,options:{data:{full_name:$('#nm').value,requested:$('#rq').value}}}):sb.auth.signInWithPassword({email,password}));
  if(error)return alert(error.message);if(m==='up')alert('Account created! Confirm your email if asked, then an admin will verify you.')}
 else{user={id:'demo',email,role:'admin',name:email};localStorage.setItem('sg_user',JSON.stringify(user))}
 location.href='index.html'}
$('#auth').onclick=async()=>{if(user){if(sb)await sb.auth.signOut();else localStorage.removeItem('sg_user');user=null;location.href='index.html'}else location.href='login.html'};
function tick(){const c=$('#cd');if(!c)return;let s=Math.max(0,(new Date(c.dataset.t)-new Date())/1000|0);
 c.innerHTML=[['Days',86400],['Hours',3600],['Mins',60],['Secs',1]].map(([n,v])=>{const x=Math.floor(s/v);s-=x*v;return`<div><b>${x}</b><span>${n}</span></div>`}).join('')}
setInterval(tick,1000);

// theme + mood
const root=document.documentElement;
function setTheme(t){root.dataset.theme=t;$('#th').textContent=t==='dark'?'☀️':'🌙';localStorage.setItem('sg_theme',t)}
$('#th').onclick=()=>setTheme(root.dataset.theme==='dark'?'light':'dark');
$('#mb').onclick=()=>$('header').classList.toggle('open');
document.addEventListener('click',e=>{if(!e.target.closest('header,#mb'))$('header').classList.remove('open')});
$('#mood').onchange=e=>{root.dataset.mood=e.target.value;localStorage.setItem('sg_mood',e.target.value)};
setTheme(localStorage.getItem('sg_theme')||'dark');
const m=localStorage.getItem('sg_mood');if(m){root.dataset.mood=m;$('#mood').value=m}

(async()=>{
 if(sb){const{data}=await sb.auth.getSession();await load(data.session?.user||null);sb.auth.onAuthStateChange((_,s)=>{setTimeout(()=>load(s?.user||null).then(route),0)})}
 else{user=JSON.parse(localStorage.getItem('sg_user')||'null');if(user){user.role=user.role||'admin';user.name=user.name||user.email}}
 route();
})();
</script>
